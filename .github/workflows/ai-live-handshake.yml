name: GPT-Claude live handshake (approval gated)

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

jobs:
  real-apis-synthetic-only:
    # Disparo exclusivo em PR #5 pelo titular da conta, label explicita,
    # commit revisado e variavel de autorizacao. Sem push/merge/producao.
    if: >-
      github.event.label.name == 'ai-real-test' &&
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'Linkogroup' &&
      github.event.pull_request.head.ref == 'ai/gpt-claude-pilot-20261025' &&
      vars.AI_PILOT_REAL_APPROVED == 'yes' &&
      github.event.pull_request.head.sha == vars.AI_PILOT_APPROVED_COMMIT
    runs-on: ubuntu-latest
    environment: ai-homologacao
    timeout-minutes: 5
    steps:
      - name: Checkout somente commit aprovado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Conferir sintaxe
        run: npm --prefix experimental/ai-orchestrator run check
      - name: Contato real com OpenAI e Anthropic (objetivo ficticio)
        run: node experimental/ai-orchestrator/test/live-smoke.mjs
        env:
          AI_PILOT_MODE: real
          AI_REAL_CALLS_APPROVED: "yes"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}

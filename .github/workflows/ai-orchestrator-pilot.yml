name: GPT Claude pilot (isolated)

on:
  pull_request:
    branches: [main]
    paths:
      - "experimental/ai-orchestrator/**"
      - ".github/workflows/ai-orchestrator-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-pilot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Confirm isolated runtime
        run: node --version
      - name: Validate JavaScript
        run: npm --prefix experimental/ai-orchestrator run check
      - name: Unit and HTTP smoke tests (no real API calls)
        run: npm --prefix experimental/ai-orchestrator test
